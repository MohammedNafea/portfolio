<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Shield/Frame Background (Optional, kept minimal or transparent) -->
    <!-- Monogram MN -->
    <path d="M80 400 V112 L256 320 L432 112 V400" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Stylized connect element or accent -->
    <circle cx="256" cy="320" r="15" fill="#FFD700">
        <animate attributeName="opacity" values="0.5;1;0.5" duration="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <rect x="0" y="0" width="512" height="512" fill="none" />
</svg>
